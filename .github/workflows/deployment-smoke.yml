name: IronCore deployed web smoke

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironcore-deployment-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Deployed web release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IRONCORE_SMOKE_WEB_URL: https://gms-beige-ten.vercel.app/
      IRONCORE_SMOKE_ALLOWED_HOSTS: gms-beige-ten.vercel.app
      IRONCORE_EXPECTED_COMMIT: ${{ github.sha }}
      IRONCORE_SMOKE_DEPLOY_WAIT_MS: "600000"
      IRONCORE_SMOKE_RETRY_MS: "15000"
      IRONCORE_SMOKE_REQUEST_TIMEOUT_MS: "15000"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Verify deployed release identity and public web surface
        run: npm run smoke:deployment
