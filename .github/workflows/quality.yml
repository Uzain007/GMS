name: IronCore quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironcore-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Scan committed source for secrets
        run: npm run security:scan

      # Rendered-output contracts import the deployable worker, so the verified
      # artifact must exist before the complete portable test collection runs.
      - name: Build and validate the deployable web artifact
        run: npm run build

      - name: Run portable architecture and product contracts
        run: node --test tests/*.test.mjs

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Laravel, PostgreSQL RLS and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Keep transient registry pressure bounded without exposing a GitHub token
      # to Composer scripts or changing the reviewed dependency lockfile.
      COMPOSER_MAX_PARALLEL_HTTP: "4"
      IRONCORE_RUNTIME_GATE: "true"
      IRONCORE_S3_RUNTIME_GATE: "true"
      IRONCORE_RESTORE_DRILL_GATE: "true"
      IRONCORE_LOAD_GATE: "true"
      IRONCORE_NOTIFICATION_RUNTIME_GATE: "true"
      IRONCORE_NOTIFICATION_RUNTIME_SMTP_PORT: "1025"
      IRONCORE_NOTIFICATION_RUNTIME_HTTPS_PORT: "8443"
      IRONCORE_NOTIFICATION_RUNTIME_CERTIFICATE: /tmp/ironcore-notification-runtime-cert.pem
      IRONCORE_NOTIFICATION_RUNTIME_PRIVATE_KEY: /tmp/ironcore-notification-runtime-key.pem
      IRONCORE_NOTIFICATION_RUNTIME_EVIDENCE_URL: https://127.0.0.1:8443
      IRONCORE_NOTIFICATION_RUNTIME_EVIDENCE_TOKEN: ironcore-ci-evidence-only
      IRONCORE_NOTIFICATION_RUNTIME_REJECTION_MARKER: ironcore-ci-provider-response-marker
      IRONCORE_STRIPE_RUNTIME_GATE: "true"
      IRONCORE_STRIPE_RUNTIME_HTTPS_PORT: "8444"
      IRONCORE_STRIPE_RUNTIME_CERTIFICATE: /tmp/ironcore-stripe-runtime-cert.pem
      IRONCORE_STRIPE_RUNTIME_PRIVATE_KEY: /tmp/ironcore-stripe-runtime-key.pem
      IRONCORE_STRIPE_RUNTIME_EVIDENCE_URL: https://127.0.0.1:8444
      IRONCORE_STRIPE_RUNTIME_EVIDENCE_TOKEN: ironcore-ci-stripe-evidence-only
      IRONCORE_STRIPE_RUNTIME_REJECTION_MARKER: ironcore-ci-stripe-response-marker
      APP_NAME: IronCore API
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: ironcore_test
      DB_USERNAME: ironcore_app
      DB_PASSWORD: ironcore-ci-app-only
      CI_POSTGRES_HOST: 127.0.0.1
      CI_POSTGRES_PORT: "5432"
      CI_POSTGRES_ADMIN_DATABASE: postgres
      CI_POSTGRES_SUPERUSER: postgres
      CI_POSTGRES_SUPERUSER_PASSWORD: ironcore-ci-owner-only
      CI_POSTGRES_DATABASE: ironcore_test
      CI_POSTGRES_APP_ROLE: ironcore_app
      CI_POSTGRES_APP_PASSWORD: ironcore-ci-app-only
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "1025"
      MAIL_USERNAME: ironcore-ci-smtp
      MAIL_PASSWORD: ironcore-ci-smtp-only
      MAIL_FROM_ADDRESS: runtime@ironcore.test
      NOTIFICATION_SMS_ENDPOINT: https://127.0.0.1:8443/sms
      NOTIFICATION_SMS_TOKEN: ironcore-ci-sms-only
      NOTIFICATION_PUSH_ENDPOINT: https://127.0.0.1:8443/push
      NOTIFICATION_PUSH_TOKEN: ironcore-ci-push-only
      NOTIFICATION_CA_BUNDLE: /tmp/ironcore-notification-runtime-cert.pem
      STRIPE_SECRET_KEY: ironcore-ci-stripe-only
      STRIPE_WEBHOOK_SECRET: ironcore-ci-connect-signing-only
      STRIPE_BILLING_WEBHOOK_SECRET: ironcore-ci-billing-signing-only
      STRIPE_API_URL: https://127.0.0.1:8444
      STRIPE_CONNECT_REFRESH_URL: https://app.ironcore.test/payments?stripe=refresh
      STRIPE_CONNECT_RETURN_URL: https://app.ironcore.test/payments?stripe=return
      STRIPE_CHECKOUT_SUCCESS_URL: https://app.ironcore.test/payments?payment={PAYMENT_ID}&checkout=success
      STRIPE_CHECKOUT_CANCEL_URL: https://app.ironcore.test/payments?payment={PAYMENT_ID}&checkout=cancelled
      STRIPE_BILLING_CHECKOUT_SUCCESS_URL: https://app.ironcore.test/billing?gym={GYM_ID}&checkout=success
      STRIPE_BILLING_CHECKOUT_CANCEL_URL: https://app.ironcore.test/billing?gym={GYM_ID}&checkout=cancelled
      STRIPE_BILLING_PORTAL_RETURN_URL: https://app.ironcore.test/billing
      STRIPE_CA_BUNDLE: /tmp/ironcore-stripe-runtime-cert.pem
      # These are disposable emulator credentials, never production secrets.
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ironcore-ci-s3
      AWS_SECRET_ACCESS_KEY: ironcore-ci-s3-only
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ironcore-ci-exports
      AWS_ENDPOINT: http://127.0.0.1:4566
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      LOG_CHANNEL: stderr
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ironcore-ci-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3:
        # LocalStack is an ephemeral S3 protocol gate, not a production provider.
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl --fail --silent http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP and required extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Set up locked Node runtime for CI helpers
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Generate an ephemeral application key
        shell: bash
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Prepare the non-superuser RLS database
        run: php scripts/ci/prepare-postgres.php

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --strict --no-check-publish

      - name: Locate Composer download cache
        id: composer-cache
        shell: bash
        working-directory: backend
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore lockfile-keyed Composer download cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-files-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.lock') }}

      - name: Install backend dependencies
        # The runner passes this read-only token only to Composer's
        # no-plugin/no-script prefetch child, then strips it before activation.
        env:
          IRONCORE_COMPOSER_GITHUB_TOKEN: ${{ github.token }}
        working-directory: backend
        run: node ../scripts/ci/install-composer-dependencies.mjs

      - name: Audit backend dependencies
        working-directory: backend
        run: composer audit --no-interaction

      - name: Start disposable notification provider boundary
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$IRONCORE_NOTIFICATION_RUNTIME_PRIVATE_KEY" \
            -out "$IRONCORE_NOTIFICATION_RUNTIME_CERTIFICATE" \
            -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" > /dev/null 2>&1
          node scripts/ci/notification-provider-sandbox.mjs > /tmp/ironcore-notification-runtime.log 2>&1 &
          echo "$!" > /tmp/ironcore-notification-runtime.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --cacert "$IRONCORE_NOTIFICATION_RUNTIME_CERTIFICATE" \
              "$IRONCORE_NOTIFICATION_RUNTIME_EVIDENCE_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/ironcore-notification-runtime.log
          exit 1

      - name: Start disposable Stripe provider boundary
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$IRONCORE_STRIPE_RUNTIME_PRIVATE_KEY" \
            -out "$IRONCORE_STRIPE_RUNTIME_CERTIFICATE" \
            -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" > /dev/null 2>&1
          node scripts/ci/stripe-provider-sandbox.mjs > /tmp/ironcore-stripe-runtime.log 2>&1 &
          echo "$!" > /tmp/ironcore-stripe-runtime.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --cacert "$IRONCORE_STRIPE_RUNTIME_CERTIFICATE" \
              "$IRONCORE_STRIPE_RUNTIME_EVIDENCE_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/ironcore-stripe-runtime.log
          exit 1

      - name: Run Laravel, PostgreSQL RLS, Redis, provider and S3 tests
        working-directory: backend
        run: php artisan test --fail-on-skipped --fail-on-risky

      - name: Stop disposable Stripe provider boundary
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ironcore-stripe-runtime.pid ]]; then
            provider_pid="$(tr -cd '0-9' < /tmp/ironcore-stripe-runtime.pid)"
            if [[ -n "$provider_pid" ]]; then
              kill -- "$provider_pid" 2>/dev/null || true
            fi
          fi
          if [[ "${{ job.status }}" != "success" && -f /tmp/ironcore-stripe-runtime.log ]]; then
            tail -100 /tmp/ironcore-stripe-runtime.log
          fi
          rm -f -- \
            "$IRONCORE_STRIPE_RUNTIME_CERTIFICATE" \
            "$IRONCORE_STRIPE_RUNTIME_PRIVATE_KEY"

      - name: Stop disposable notification provider boundary
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ironcore-notification-runtime.pid ]]; then
            provider_pid="$(tr -cd '0-9' < /tmp/ironcore-notification-runtime.pid)"
            if [[ -n "$provider_pid" ]]; then
              kill -- "$provider_pid" 2>/dev/null || true
            fi
          fi
          if [[ "${{ job.status }}" != "success" && -f /tmp/ironcore-notification-runtime.log ]]; then
            tail -100 /tmp/ironcore-notification-runtime.log
          fi
          rm -f -- \
            "$IRONCORE_NOTIFICATION_RUNTIME_CERTIFICATE" \
            "$IRONCORE_NOTIFICATION_RUNTIME_PRIVATE_KEY"

      - name: Run synthetic PostgreSQL backup and restore drill
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/verify-postgres-restore.sh

      - name: Prepare synthetic report load fixture
        run: php scripts/ci/prepare-load-fixture.php

      - name: Set up pinned Grafana k6 runtime
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "1.7.1"

      - name: Start disposable Laravel load target
        working-directory: backend
        shell: bash
        run: |
          setsid env PHP_CLI_SERVER_WORKERS=16 php artisan serve --host=127.0.0.1 --port=8000 > /tmp/ironcore-load-server.log 2>&1 &
          echo "$!" > /tmp/ironcore-load-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/ironcore-load-server.log
          exit 1

      - name: Gate cached tenant report throughput and isolation
        run: k6 run scripts/load/report-overview.k6.js

      - name: Stop disposable Laravel load target
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ironcore-load-server.pid ]]; then
            server_pid="$(tr -cd '0-9' < /tmp/ironcore-load-server.pid)"
            if [[ -n "$server_pid" ]]; then
              kill -- "-$server_pid" 2>/dev/null || true
            fi
          fi
          if [[ "${{ job.status }}" != "success" && -f /tmp/ironcore-load-server.log ]]; then
            tail -100 /tmp/ironcore-load-server.log
          fi

      - name: Validate production Laravel caches
        working-directory: backend
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
