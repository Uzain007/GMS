services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ironcore
      # The owner bootstraps the database; Laravel connects as non-superuser
      # ironcore_app so FORCE ROW LEVEL SECURITY cannot be bypassed.
      POSTGRES_USER: ironcore_owner
      POSTGRES_PASSWORD: change-me-owner
    volumes:
      - ironcore_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironcore_owner -d ironcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - ironcore_redis:/data

  mailpit:
    # Local-only SMTP inbox. Production replaces these values with its
    # authenticated provider and never exposes an inbox port publicly.
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mailpit: { condition: service_started }
    ports: ["8000:8000"]
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mailpit: { condition: service_started }
    # Password recovery stays asynchronous and non-enumerating. The worker
    # runs from the same immutable application image as the API.
    command: php artisan queue:work redis --queue=default,notifications --sleep=1 --tries=3 --timeout=60

volumes:
  ironcore_postgres:
  ironcore_redis:
